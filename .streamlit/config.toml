[theme]
base = "dark"
primaryColor = "#38bdf8"
backgroundColor = "#0b1426"
secondaryBackgroundColor = "#111c33"
textColor = "#d6e2f5"

[browser]
gatherUsageStats = false

[client]
# "viewer" hides developer-only toolbar items (Deploy, Rerun, Clear Cache).
# This is the official Streamlit setting — not a DOM hack.
toolbarMode = "viewer"

[server]
headless = true
enableStaticServing = true
